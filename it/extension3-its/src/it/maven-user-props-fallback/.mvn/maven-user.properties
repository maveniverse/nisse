# Simulates the export-subst scenario: git archive expanded the $Format:...$
# placeholder into a real version string.  In Maven 3 this file is NOT
# auto-loaded, so NisseConfigurationProcessor must read it explicitly.
nisse.jgit.dynamicVersion=1.2.3-from-maven-user-props
