# Simulates a git checkout where export-subst placeholders have NOT been
# expanded (i.e. this is a git clone, not a git archive).  The unexpanded
# placeholder must be ignored by NisseConfigurationProcessor.
nisse.jgit.dynamicVersion=$Format:%(describe:tags=true)$
